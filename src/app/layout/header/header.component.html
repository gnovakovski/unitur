<header class="header">
  <div class="container">
    <div class="logo">
      <a routerLink="/">
        <!-- width/height = proporção real do arquivo: reserva o espaço antes da imagem
             carregar (sem isto o menu "pulava" para o lado). O CSS define a altura. -->
        <img src="assets/logo.jpeg" alt="Unitur Logo" class="logo-image" width="575" height="154">
      </a>
    </div>
    
    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <nav class="nav" [class.active]="menuOpen">
      @for (link of links; track link.id) {
        <a [routerLink]="link.route" routerLinkActive="active" class="nav-link" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>
  </div>
</header>
