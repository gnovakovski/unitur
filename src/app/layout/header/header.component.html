<header class="header">
  <div class="container">
    <div class="logo">
      <a routerLink="/">
        <img src="assets/logo.jpeg" alt="Unitur Logo" class="logo-image">
      </a>
    </div>
    
    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <nav class="nav" [class.active]="menuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      <a routerLink="/viagens" routerLinkActive="active" class="nav-link">Viagens</a>
      <a routerLink="/about" routerLinkActive="active" class="nav-link">Sobre</a>
      <a routerLink="/blog" class="nav-link">Blog</a>
    </nav>
  </div>
</header>
