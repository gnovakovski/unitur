<div class="admin-container" [class.sidebar-closed]="!sidebarOpen">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="/logo.jpeg" alt="UNITUR" class="logo">
      <h2>UNITUR Admin</h2>
    </div>

    <nav class="sidebar-nav">
      @for (item of menuItems; track item.route) {
        <a 
          [routerLink]="item.route" 
          routerLinkActive="active"
          class="nav-item">
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button class="btn-site" (click)="goToSite()">
        Ver Site
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper">
    <!-- Top Bar -->
    <header class="topbar">
      <button
        class="btn-toggle"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarOpen ? 'Ocultar menu lateral' : 'Mostrar menu lateral'"
        [attr.title]="sidebarOpen ? 'Ocultar menu' : 'Mostrar menu'">
        <span class="toggle-icon" aria-hidden="true">{{ sidebarOpen ? '‹' : '›' }}</span>
        <span class="toggle-text">{{ sidebarOpen ? 'Ocultar menu' : 'Mostrar menu' }}</span>
      </button>

      <div class="topbar-right">
        @if (currentUser) {
          <div class="user-menu">
            <div class="user-info">
              <span class="user-name">{{ currentUser.name }}</span>
              <span class="user-role">{{ currentUser.role }}</span>
            </div>
            <button class="btn-logout" (click)="logout()">
              Sair
            </button>
          </div>
        }
      </div>
    </header>

    <!-- Page Content -->
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
