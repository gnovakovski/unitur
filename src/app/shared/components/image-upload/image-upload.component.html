<div class="image-upload">
  <label class="upload-label">{{ label }}</label>
  
  @if (!imageUrl) {
    <div 
      class="upload-area"
      [class.drag-over]="dragOver"
      [class.uploading]="uploading"
      (click)="triggerFileInput()"
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)">
      
      @if (uploading) {
        <div class="upload-spinner"></div>
        <p>Fazendo upload...</p>
      } @else {
        <div class="upload-icon">IMG</div>
        <p class="upload-text">Clique ou arraste uma imagem</p>
        <p class="upload-hint">JPG, PNG ou WebP (máx. {{ maxSize }}MB)</p>
      }
      
      <input 
        type="file" 
        [id]="inputId"
        [accept]="accept"
        (change)="onFileSelected($event)"
        style="display: none">
    </div>
  } @else {
    <div class="image-preview">
      <img [src]="imageUrl" [alt]="label">
      <button 
        type="button"
        class="btn-remove" 
        (click)="removeImage()"
        [disabled]="uploading">
        X
      </button>
    </div>
  }
  
  @if (error) {
    <div class="upload-error">{{ error }}</div>
  }
</div>
